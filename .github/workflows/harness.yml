# Harness constraint enforcement for pull requests.
#
# Generated by the harness-engineering plugin.
# Runs PR-scoped constraints from HARNESS.md against changed files.
#
# Inspired by Birgitta Boeckeler's "Harness Engineering":
# https://martinfowler.com/articles/exploring-gen-ai/harness-engineering.html

name: Harness Constraints

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce PR constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HARNESS.md exists
        run: |
          if [ ! -f HARNESS.md ]; then
            echo "::warning::No HARNESS.md found — skipping constraint enforcement"
            exit 0
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: "Constraint: Tests must pass"
        run: go test ./...

      - name: "Constraint: Consistent formatting"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: "Constraint: TUI has no SQL imports"
        run: bash scripts/check-tui-sql-imports.sh

      - name: "Constraint: No secrets in source"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: echo "Harness constraint check complete. See HARNESS.md for constraint details."

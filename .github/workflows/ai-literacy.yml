# AI Literacy habitat checks for pull requests.
#
# Generated by /superpowers-init.

name: AI Literacy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  habitat:
    name: Habitat checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run ai-literacy-check.sh
        run: bash scripts/ai-literacy-check.sh
